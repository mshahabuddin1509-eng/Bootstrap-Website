<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMORA - AI for Everyone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            background: #080b16;
            color: white;
        }

        .navbar {
            background: #080b16;
            padding: 20px 5%;
        }

        .navbar-brand {
            color: white !important;
            font-size: 25px;
            font-weight: 800;
        }

        .nav-link {
            color: #aaa !important;
            margin: 0 8px;
        }

        .nav-link:hover {
            color: white !important;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            padding: 60px 8%;
        }

        .hero-text {
            max-width: 600px;
        }

        .badge-custom {
            background: rgba(124, 92, 255, 0.15);
            color: #a995ff;
            border: 1px solid #5d48c7;
            padding: 8px 15px;
            border-radius: 50px;
        }

        h1 {
            font-size: 65px;
            font-weight: 800;
            line-height: 1.05;
            margin-top: 25px;
        }

        h1 span {
            color: #8b72ff;
        }

        .description {
            color: #aaa;
            font-size: 18px;
            line-height: 1.7;
            margin: 25px 0;
        }

        .btn-main {
            background: #765cff;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-main:hover {
            background: #6046e8;
            color: white;
        }

        .btn-outline {
            border: 1px solid #444;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            margin-left: 10px;
        }

        .btn-outline:hover {
            background: white;
            color: #080b16;
        }

        .ai-visual {
            width: 330px;
            height: 330px;
            border-radius: 50%;
            background: radial-gradient(circle, #8b72ff, #39277e 40%, #11152c 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 100px rgba(117, 89, 255, 0.4);
        }

        .ai-card {
            width: 190px;
            height: 130px;
            background: rgba(15, 18, 35, 0.9);
            border: 1px solid #6252b5;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .ai-card h2 {
            margin: 0;
            color: #a995ff;
        }

        .ai-card p {
            color: #aaa;
            margin: 5px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 80px;
            padding: 25px;
            border-top: 1px solid #222;
        }

        .stat {
            text-align: center;
        }

        .stat h3 {
            font-weight: 700;
            margin: 0;
        }

        .stat p {
            color: #777;
            margin: 5px 0;
        }

        @media (max-width: 768px) {

            .navbar {
                padding: 15px 20px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                padding: 50px 20px;
                gap: 50px;
            }

            h1 {
                font-size: 45px;
            }

            .description {
                font-size: 16px;
            }

            .ai-visual {
                width: 260px;
                height: 260px;
            }

            .stats {
                flex-direction: column;
                gap: 20px;
            }

            .btn-outline {
                margin-left: 5px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-md">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">LUMORA<span style="color:#8b72ff;">.</span></a>

            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto align-items-center">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>

                    <li class="nav-item">
                        <button class="btn btn-main ms-2">
                            Get Started
                        </button>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <section class="hero">

        <div class="hero-text">

            <span class="badge-custom">
                ✦ AI POWERED
            </span>

            <h1>
                Work smarter.<br>
                <span>Not harder.</span>
            </h1>

            <p class="description">
                Meet LUMORA — intelligent tools designed to help
                you create, automate and achieve more.
            </p>

            <div>
                <button class="btn btn-main">
                    Get Started →
                </button>

                <button class="btn btn-outline">
                    Learn More
                </button>
            </div>

        </div>

        <div class="ai-visual">

            <div class="ai-card">
                <h2>✦ LUMORA</h2>
                <p>AI Assistant</p>
                <small style="color:#70e0a5;">● Online</small>
            </div>

        </div>

    </section>

    <section class="stats">

        <div class="stat">
            <h3>10K+</h3>
            <p>Active Users</p>
        </div>

        <div class="stat">
            <h3>99.9%</h3>
            <p>Uptime</p>
        </div>

        <div class="stat">
            <h3>24/7</h3>
            <p>AI Support</p>
        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
